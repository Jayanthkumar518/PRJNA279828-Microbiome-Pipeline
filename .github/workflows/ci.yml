name: Nextflow Pipeline CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Validate Nextflow pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - name: Create CI test input data
        run: |
          mkdir -p data/raw_fastq

          printf '@CI_TEST\nACGTACGTACGT\n+\nFFFFFFFFFFFF\n' \
            | gzip > data/raw_fastq/SRR2914118_1.fastq.gz

          printf '@CI_TEST\nTGCATGCATGCA\n+\nFFFFFFFFFFFF\n' \
            | gzip > data/raw_fastq/SRR2914118_2.fastq.gz

      - name: Validate Nextflow pipeline
        run: |
          nextflow run main.nf -stub-run -ansi-log false
